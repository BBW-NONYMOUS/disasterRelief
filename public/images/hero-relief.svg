<svg viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Volunteers delivering relief goods to a community after a disaster">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="670" cy="110" r="55" fill="#fde68a"/>
  <circle cx="670" cy="110" r="40" fill="#fcd34d"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="120" rx="60" ry="26"/>
    <ellipse cx="200" cy="130" rx="50" ry="22"/>
    <ellipse cx="520" cy="80" rx="45" ry="20"/>
  </g>

  <!-- ground -->
  <rect y="440" width="800" height="160" fill="url(#ground)"/>
  <path d="M0 440 Q200 410 400 440 T800 440 V600 H0 Z" fill="#4ade80" opacity="0.5"/>

  <!-- relief tent -->
  <g>
    <rect x="90" y="300" width="260" height="150" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <polygon points="70,300 220,220 370,300" fill="url(#tent)"/>
    <polygon points="220,220 370,300 340,300 220,235" fill="#1e40af" opacity="0.5"/>
    <!-- cross emblem -->
    <rect x="200" y="255" width="40" height="12" rx="2" fill="#ffffff"/>
    <rect x="214" y="241" width="12" height="40" rx="2" fill="#ffffff"/>
    <!-- tent opening -->
    <rect x="180" y="360" width="80" height="90" rx="4" fill="#bfdbfe"/>
  </g>

  <!-- supply boxes -->
  <g>
    <rect x="380" y="380" width="90" height="70" rx="4" fill="#f59e0b"/>
    <rect x="380" y="380" width="90" height="16" fill="#d97706"/>
    <line x1="425" y1="380" x2="425" y2="450" stroke="#b45309" stroke-width="3"/>
    <rect x="480" y="400" width="70" height="50" rx="4" fill="#fbbf24"/>
    <line x1="515" y1="400" x2="515" y2="450" stroke="#b45309" stroke-width="3"/>
  </g>

  <!-- volunteer 1 (carrying box) -->
  <g>
    <circle cx="600" cy="340" r="22" fill="#fcd7b6"/>
    <rect x="582" y="360" width="36" height="55" rx="10" fill="#16a34a"/>
    <rect x="560" y="378" width="60" height="40" rx="4" fill="#f59e0b"/>
    <rect x="588" y="415" width="12" height="35" rx="5" fill="#1f2937"/>
    <rect x="604" y="415" width="12" height="35" rx="5" fill="#1f2937"/>
  </g>

  <!-- volunteer 2 (helping person) -->
  <g>
    <circle cx="690" cy="345" r="20" fill="#e8b48f"/>
    <rect x="674" y="363" width="34" height="52" rx="10" fill="#2563eb"/>
    <rect x="678" y="413" width="12" height="35" rx="5" fill="#1f2937"/>
    <rect x="694" y="413" width="12" height="35" rx="5" fill="#1f2937"/>
    <!-- helping hand reaching -->
    <rect x="655" y="378" width="30" height="10" rx="5" fill="#e8b48f"/>
  </g>

  <!-- heart / care symbol floating -->
  <g transform="translate(430,150)">
    <path d="M40 70 C10 45 0 20 20 8 C33 0 40 12 40 20 C40 12 47 0 60 8 C80 20 70 45 40 70 Z" fill="#ef4444"/>
  </g>
</svg>
