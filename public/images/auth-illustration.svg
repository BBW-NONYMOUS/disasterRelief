<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img" aria-label="Barangay community receiving relief during a flood">
  <defs>
    <linearGradient id="ai-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D47A1" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A3576" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="ai-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BE6"/>
      <stop offset="1" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop -->
  <rect width="520" height="360" fill="url(#ai-sky)"/>
  <circle cx="430" cy="60" r="38" fill="#FFFFFF" opacity=".12"/>
  <circle cx="70" cy="40" r="22" fill="#FFFFFF" opacity=".08"/>

  <!-- rain -->
  <g stroke="#BBDEFB" stroke-width="3" stroke-linecap="round" opacity=".55">
    <line x1="92"  y1="52"  x2="84"  y2="74"/>
    <line x1="150" y1="30"  x2="142" y2="52"/>
    <line x1="208" y1="58"  x2="200" y2="80"/>
    <line x1="296" y1="34"  x2="288" y2="56"/>
    <line x1="362" y1="62"  x2="354" y2="84"/>
    <line x1="438" y1="110" x2="430" y2="132"/>
  </g>

  <!-- barangay houses on higher ground -->
  <g>
    <rect x="58" y="168" width="84" height="64" rx="6" fill="#E3F2FD"/>
    <path d="M48 172 100 128l52 44Z" fill="#FF8F00"/>
    <rect x="86" y="196" width="26" height="36" rx="3" fill="#1565C0"/>
    <rect x="356" y="156" width="96" height="76" rx="6" fill="#E3F2FD"/>
    <path d="M344 162 404 112l60 50Z" fill="#FFB74D"/>
    <rect x="372" y="182" width="24" height="22" rx="3" fill="#1565C0"/>
    <rect x="410" y="182" width="24" height="22" rx="3" fill="#1565C0"/>
  </g>

  <!-- location pin dropping on the incident -->
  <g>
    <path d="M260 84c-18.8 0-34 15.2-34 34 0 25.5 34 57 34 57s34-31.5 34-57c0-18.8-15.2-34-34-34Z" fill="#FFFFFF"/>
    <path d="M260 141.6s-18.8-11.9-18.8-24.9c0-6.6 5.1-11.7 11.4-11.7 4 0 6.1 1.8 7.4 3.8 1.3-2 3.4-3.8 7.4-3.8 6.3 0 11.4 5.1 11.4 11.7 0 13-18.8 24.9-18.8 24.9Z" fill="#FF8F00"/>
    <circle cx="260" cy="118" r="52" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".35"/>
    <circle cx="260" cy="118" r="68" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".18"/>
  </g>

  <!-- relief boat delivering goods -->
  <g>
    <path d="M196 268h128l-14 26h-100Z" fill="#FF8F00"/>
    <rect x="228" y="238" width="30" height="30" rx="4" fill="#E3F2FD"/>
    <rect x="240" y="238" width="6" height="30" fill="#1565C0"/>
    <rect x="228" y="249" width="30" height="6" fill="#1565C0"/>
    <rect x="266" y="246" width="24" height="22" rx="4" fill="#BBDEFB"/>
  </g>

  <!-- flood water -->
  <g>
    <path d="M0 292c40-14 80-14 120 0s80 14 120 0 80-14 120 0 80 14 120 0 40-10 40-10v78H0Z" fill="url(#ai-water)" opacity=".9"/>
    <path d="M0 316c40-12 80-12 120 0s80 12 120 0 80-12 120 0 80 12 120 0 40-8 40-8v52H0Z" fill="#1565C0" opacity=".85"/>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".4">
      <path d="M64 306q14-8 28 0"/>
      <path d="M332 300q14-8 28 0"/>
      <path d="M448 318q14-8 28 0"/>
    </g>
  </g>
</svg>
